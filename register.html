<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
    }

    .landing-layout {
        display: flex;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
        background: #08164A;
        align-items: center;
        justify-content: center;
    }

    /* REGISTRATION PANEL */
    .auth-pane {
        width: 100%;
        height: 100%;
        min-height: 0;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: rgba(0,0,0,0.2);
        backdrop-filter: blur(10px);
        border-left: 1px solid rgba(255,255,255,0.05);
    }

    /* REGISTRATION CARD */
    .glass-card {
        width: 100%;
        max-width: 560px;
        max-height: 100%;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        border-radius: 16px;
    }

    .auth-card {
        padding: 12px;
        overflow: hidden;
    }

    /* HEADER */
    .auth-card .auth__header {
        padding: 5px 15px 8px;
        text-align: center;
    }

    .auth-card .auth__title {
        font-size: 1.5rem;
        margin-bottom: 3px;
    }

    .auth-card .auth__subtitle {
        font-size: 0.85rem;
        margin: 0;
    }

    /* TWO-COLUMN FORM */
    .auth-card .auth__form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px 14px;
        padding: 8px 15px;
        margin: 0;
    }

    .auth-card .form-group {
        width: 100%;
        min-width: 0;
        margin: 0;
    }

    .auth-card .form-label {
        display: block;
        font-size: 0.82rem;
        margin-bottom: 4px;
    }

    .auth-card .form-input,
    .auth-card .input-wrapper {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
    }

    .auth-card .form-input {
        height: 40px;
        padding: 8px 10px;
        font-size: 0.9rem;
    }

    .auth-card .input-wrapper {
        position: relative;
    }

    .auth-card .input-wrapper .form-input {
        padding-right: 40px;
    }

    .auth-card .input-action {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
    }

    /* TERMS */
    .auth-card .form-options {
        grid-column: 1 / -1;
        padding: 2px 0;
        margin: 0;
    }

    .auth-card .checkbox-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
    }

    .auth-card .checkbox-label {
        line-height: 1.3;
    }

    /* BUTTONS */
    .auth-card button[type="submit"],
    .auth-card #google-login-btn {
        grid-column: 1 / -1;
        width: 100%;
        min-height: 40px;
        margin: 0;
        padding: 8px 12px;
        font-size: 0.9rem;
    }

    .auth-card .auth__divider {
        grid-column: 1 / -1;
        margin: 0;
        padding: 0;
        text-align: center;
        font-size: 0.8rem;
    }

    /* FOOTER */
    .auth-card .auth__footer {
        padding: 8px 15px 5px;
        text-align: center;
        font-size: 0.85rem;
    }

    .auth-card .auth__footer p {
        margin: 0;
    }

    /* TABLETS AND PHONES */
    @media (max-width: 900px) {
        .landing-layout {
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            flex-direction: column;
        }

        .auth-pane {
            padding: 10px;
            border-left: none;
        }

        .glass-card {
            max-width: 520px;
        }
    }

    /* SMALL PHONES */
    @media (max-width: 480px) {
        .auth-pane {
            padding: 8px;
        }

        .glass-card {
            border-radius: 12px;
        }

        .auth-card {
            padding: 8px;
        }

        .auth-card .auth__header {
            padding: 4px 8px 7px;
        }

        .auth-card .auth__title {
            font-size: 1.25rem;
        }

        .auth-card .auth__form {
            gap: 7px 9px;
            padding: 6px 8px;
        }

        .auth-card .form-label {
            font-size: 0.75rem;
            margin-bottom: 3px;
        }

        .auth-card .form-input {
            height: 37px;
            padding: 7px;
            font-size: 0.82rem;
        }

        .auth-card .auth__footer {
            padding: 7px 8px 3px;
            font-size: 0.78rem;
        }
    }

    /* SHORT SCREENS */
    @media (max-height: 700px) {
        .auth-pane {
            padding: 5px;
        }

        .auth-card {
            padding: 6px;
        }

        .auth-card .auth__header {
            padding-top: 2px;
            padding-bottom: 4px;
        }

        .auth-card .auth__title {
            font-size: 1.2rem;
        }

        .auth-card .auth__form {
            gap: 5px 10px;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        .auth-card .form-input {
            height: 34px;
        }

        .auth-card .auth__footer {
            padding-top: 5px;
            padding-bottom: 2px;
        }

        .auth-card button[type="submit"],
        .auth-card #google-login-btn {
            min-height: 35px;
            padding: 6px;
        }
    }

    /* VERY SHORT SCREENS */
    @media (max-height: 580px) {
        .auth-card .auth__title {
            font-size: 1.05rem;
        }

        .auth-card .auth__subtitle {
            font-size: 0.75rem;
        }

        .auth-card .form-label {
            font-size: 0.7rem;
        }

        .auth-card .form-input {
            height: 31px;
            font-size: 0.78rem;
        }

        .auth-card .auth__form {
            gap: 4px 8px;
        }

        .auth-card .auth__footer {
            font-size: 0.72rem;
        }
    }
</style>

    
</head>
<body>

    <div class="landing-layout">

        <!-- REGISTRATION PANEL ONLY -->
        <div class="auth-pane">

            <div class="glass-card auth-card">

                <div class="auth__header">
                    <h2 class="auth__title">Create an Account</h2>
                    <p class="auth__subtitle">Join SMM-MARIA today</p>
                </div>

                <form class="auth__form" id="register-form" onsubmit="handleRegister(event)">

                    <div class="form-group">
                        <label for="fullname" class="form-label">Full Name</label>
                        <input
                            type="text"
                            id="fullname"
                            class="form-input"
                            placeholder="John Mathew"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            class="form-input"
                            placeholder="john@example.com"
                            oninput="this.value = this.value.toLowerCase();"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input
                            type="text"
                            id="username"
                            class="form-input"
                            placeholder="john123"
                            oninput="this.value = this.value.toLowerCase();"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="country" class="form-label">Country</label>
                        <input
                            type="text"
                            id="country"
                            class="form-input"
                            placeholder="e.g., Uganda"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            class="form-input"
                            placeholder="+2567XXXXXXXX"
                            required
                        >
                    </div>

                    <div class="form-group">

                        <div class="form-label-row">
                            <label for="password" class="form-label">Password</label>
                        </div>

                        <div class="input-wrapper">

                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="••••••••"
                                required
                            >

                            <button
                                type="button"
                                class="input-action"
                                aria-label="Toggle Password Visibility"
                                onclick="togglePasswordVisibility(this)"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    width="18"
                                    height="18"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>

                        </div>
                    </div>

                    <!-- TERMS AND CONDITIONS -->
                    <div class="form-options">

                        <label class="checkbox-wrapper">

                            <input
                                type="checkbox"
                                name="terms"
                                required
                            >

                            <span class="checkbox-label">
                                I agree to the
                                <a href="#" class="form-link">
                                    Terms & Conditions
                                </a>
                            </span>

                        </label>

                    </div>

                    <button
                        type="submit"
                        class="btn btn--primary btn--block"
                    >
                        Create Account
                    </button>

                    <div class="auth__divider">
                        <span>OR</span>
                    </div>

                    <!-- GOOGLE REGISTRATION -->
                    <button
                        type="button"
                        id="google-login-btn"
                        class="btn btn--outline btn--block"
                        style="display:flex; align-items:center; justify-content:center; gap:10px;"
                    >

                        <svg width="18" height="18" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>

                        <span>Continue with Google</span>

                    </button>

                </form>

                <div class="auth__footer">
                    <p>
                        Already have an account?
                        <a href="login.html" class="form-link">Sign in</a>
                    </p>
                </div>

            </div>

        </div>

    </div>

    <!-- PASSWORD VISIBILITY -->
    <script>
        function togglePasswordVisibility(btn) {

            const input = btn.parentElement.querySelector('input');

            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }

        }
    </script>

    <!-- GOOGLE IDENTITY SERVICES -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- EXISTING APPLICATION SCRIPT -->
    <script type="module" src="assets/js/app.js"></script>

</body>
</html>
