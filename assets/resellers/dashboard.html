<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
  
    <title>Dashboard | SMMMARIA Reseller child panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/typography.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/cards.css">
    <link rel="stylesheet" href="assets/css/buttons.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/tables.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-page="dashboard">
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header">
                <a href="dashboard.html" class="sidebar__logo">SMM<span class="text-gold">MARIA </span></a>
                <button class="sidebar__collapse-btn" id="collapse-btn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
            </div>
            <nav class="sidebar__nav">
                <ul class="sidebar__menu">
                    <li class="sidebar__item active"><a href="dashboard.html" class="sidebar__link"><span class="link-text">Dashboard</span></a></li>
                    <li class="sidebar__item"><a href="users.html" class="sidebar__link"><span class="link-text">Users</span></a></li>
                    <li class="sidebar__item"><a href="orders.html" class="sidebar__link"><span class="link-text">Orders</span></a></li>
                    <li class="sidebar__item"><a href="services.html" class="sidebar__link"><span class="link-text">Services & Pricing</span></a></li>
                    <li class="sidebar__item"><a href="wallet.html" class="sidebar__link"><span class="link-text">Wallet</span></a></li>
                    <li class="sidebar__item"><a href="announcements.html" class="sidebar__link"><span class="link-text">Announcements</span></a></li>
                    <li class="sidebar__item"><a href="tickets.html" class="sidebar__link"><span class="link-text">Tickets</span></a></li>
                    <li class="sidebar__item"><a href="settings.html" class="sidebar__link"><span class="link-text">Settings</span></a></li>
                    <li class="sidebar__item"><a href="login.html" class="sidebar__link sidebar__link--logout" onclick="handleLogout()"><span class="link-text">Logout</span></a></li>
                </ul>
            </nav>
        </aside>

        <!-- MAIN -->
        <div class="main-wrapper">
            <header class="navbar">
                <div class="navbar__left">
                    <button class="navbar__toggle" id="mobile-menu-toggle"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
                    <h1 class="navbar__title">Dashboard Child Panel</h1>
                </div>
                <div class="navbar__right">
                    <div class="navbar__balance">
                        <span>Balance:</span> <strong class="text-gold">$0.00</strong>
                    </div>
                </div>
            </header>

            <main class="content-area">
                <div class="stats-grid">
                    <div class="card stat-card">
                        <div class="stat-card__top"><span class="stat-card__label">Total Users</span></div>
                        <h3 class="stat-card__value">0</h3>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-card__top"><span class="stat-card__label">Total Orders</span></div>
                        <h3 class="stat-card__value">0</h3>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-card__top"><span class="stat-card__label">Total Revenue</span></div>
                        <h3 class="stat-card__value">$0.00</h3>
                        <!-- Withdrawal Button Added Here -->
                        <button class="btn btn--outline btn--sm btn--block" style="margin-top: 15px;" id="withdrawBtn">Request Withdrawal</button>
                    </div>
                </div>

                <div class="card" style="margin-top: 20px;">
                    <div class="card__header"><h3 class="card__title">Recent Orders</h3></div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead><tr><th>ID</th><th>User</th><th>Service</th><th>Amount</th><th>Status</th></tr></thead>
                            <tbody>
                                <tr><td colspan="5" class="text-center text-muted">No orders yet.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
