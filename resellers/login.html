<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
   
    <title>Reseller Login | SMMMARIA CHILDPANEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/typography.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/buttons.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-page="auth">
    <div class="auth-card">
        <div class="brand-logo">SMM<span>MARIA </span> <small>Reseller child Panel</small></div>
        <h2>Welcome Back!</h2>
        <p>Sign in to manage your panel</p>
        
        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="identifier">Admin Username or Account ID</label>
                <input type="text" id="identifier" class="form-input" placeholder="Enter Admin Username or Account ID" required>
                <small style="display: block; margin-top: 5px; font-size: 12px; color: rgba(255,255,255,0.5);">
                    * Enter your Account ID to login without a password.
                </small>
            </div>
            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label" for="password">Password</label>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="•••••••• (Leave blank if using Account ID)">
                    <button type="button" class="input-action" aria-label="Toggle Password Visibility" onclick="togglePasswordVisibility(this)">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn--primary btn--block">Sign In</button>
        </form>
        
        <div class="auth-footer">
            <p>Are you a customer? <a href="../login.html">User Login</a></p>
        </div>
    </div>
    
    <script>
        function togglePasswordVisibility(btn) {
            const input = btn.parentElement.querySelector('input');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>

    <!-- JS Imports -->
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
