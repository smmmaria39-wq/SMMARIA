<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
   
    <title>Settings | SMMMARIA Reseller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/typography.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/cards.css">
    <link rel="stylesheet" href="assets/css/buttons.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/tables.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-page="settings">
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header">
                <a href="dashboard.html" class="sidebar__logo">SMM<span class="text-gold">MARIA</span></a>
                <button class="sidebar__collapse-btn" id="collapse-btn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
            </div>
            <nav class="sidebar__nav">
                <ul class="sidebar__menu">
                    <li class="sidebar__item"><a href="dashboard.html" class="sidebar__link"><span class="link-text">Dashboard</span></a></li>
                    <li class="sidebar__item"><a href="users.html" class="sidebar__link"><span class="link-text">Users</span></a></li>
                    <li class="sidebar__item"><a href="orders.html" class="sidebar__link"><span class="link-text">Orders</span></a></li>
                    <li class="sidebar__item"><a href="services.html" class="sidebar__link"><span class="link-text">Services & Pricing</span></a></li>
                    <li class="sidebar__item"><a href="wallet.html" class="sidebar__link"><span class="link-text">Wallet</span></a></li>
                    <li class="sidebar__item"><a href="announcements.html" class="sidebar__link"><span class="link-text">Announcements</span></a></li>
                    <li class="sidebar__item"><a href="tickets.html" class="sidebar__link"><span class="link-text">Tickets</span></a></li>
                    <li class="sidebar__item active"><a href="settings.html" class="sidebar__link"><span class="link-text">Settings</span></a></li>
                    <li class="sidebar__item"><a href="login.html" class="sidebar__link sidebar__link--logout" onclick="handleLogout()"><span class="link-text">Logout</span></a></li>
                </ul>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="navbar">
                <div class="navbar__left">
                    <button class="navbar__toggle" id="mobile-menu-toggle"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
                    <h1 class="navbar__title">Settings</h1>
                </div>
                <div class="navbar__right">
                    <div class="navbar__balance">
                        <span class="balance-label">Balance:</span> <strong class="text-gold">$0.00</strong>
                    </div>
                </div>
            </header>

            <main class="content-area">
                <div class="dashboard-row" style="grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch;">
                    <div class="card">
                        <div class="card__header"><h3 class="card__title">Profile Settings</h3></div>
                        <form id="profile-form" class="card__body">
                            <div class="form-group">
                                <label class="form-label" for="username">Username</label>
                                <input type="text" id="username" name="username" class="form-input" readonly>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" id="email" name="email" class="form-input">
                            </div>
                            <button type="submit" class="btn btn--primary">Save Changes</button>
                        </form>
                    </div>

                    <div class="card">
                        <div class="card__header"><h3 class="card__title">Panel Branding</h3></div>
                        <form id="branding-form" class="card__body">
                            <div class="form-group">
                                <label class="form-label" for="panelName">Panel Name</label>
                                <input type="text" id="panelName" name="panelName" class="form-input" placeholder="John's SMM Panel">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="logoUrl">Logo URL</label>
                                <input type="text" id="logoUrl" name="logoUrl" class="form-input" placeholder="https://example.com/logo.png">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="primaryColor">Primary Color</label>
                                <input type="color" id="primaryColor" name="primaryColor" class="form-input" style="height: 40px; padding: 5px;" value="#F5A623">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="secondaryColor">Secondary Color</label>
                                <input type="color" id="secondaryColor" name="secondaryColor" class="form-input" style="height: 40px; padding: 5px;" value="#08164A">
                            </div>
                            <button type="submit" class="btn btn--primary">Update Branding</button>
                        </form>
                    </div>
                </div>
            </main>
            
            <footer class="footer">
                <p class="footer__text">© 2023 SMMMARIA Panel. All rights reserved.</p>
            </footer>
        </div>
        
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
    </div>
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
