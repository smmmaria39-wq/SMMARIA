<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SMMMARIA Panel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Imports -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/typography.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/buttons.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth__header">
                <a href="index.html" class="auth__logo">SMM<span class="text-gold">MARIA</span></a>
                <h2 class="auth__title">Reset Password</h2>
                <p class="auth__subtitle">Fill in your details below and contact us via WhatsApp or Telegram to reset your password.</p>
            </div>
            
            <form class="auth__form" id="forgot-form" onsubmit="return false;">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number Used</label>
                    <input type="tel" id="phone" class="form-input" placeholder="+1234567890" required>
                </div>

                <div class="form-actions" style="display: flex; gap: 12px; flex-direction: column;">
                    <button type="button" class="btn btn--primary btn--block" id="whatsapp-btn">
                        Recover via WhatsApp
                    </button>
                    <button type="button" class="btn btn--secondary btn--block" id="telegram-btn">
                        Recover via Telegram
                    </button>
                </div>
            </form>
            
            <div class="auth__footer">
                <p>Remembered your password? <a href="login.html" class="form-link">Sign in</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/app.js"></script>
    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const WHATSAPP_NUMBER = "256770898186"; // REPLACE THIS with your WhatsApp number (include country code, no +)
        const TELEGRAM_USERNAME = "SMM_MARIA_SUPPORT"; // REPLACE THIS with your Telegram username (without @)

        // Get Form Elements
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const waBtn = document.getElementById('whatsapp-btn');
        const tgBtn = document.getElementById('telegram-btn');

        // Function to validate and get data
        function getSupportMessage() {
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const phone = phoneInput.value.trim();

            if (!name || !email || !phone) {
                alert("Please fill in all fields before contacting support.");
                return null;
            }

            return `Hello SMM-MARIA Support, I need to reset my password.%0A%0A*Name:* ${name}%0A*Email:* ${email}%0A*Phone Used:* ${phone}`;
        }

        // WhatsApp Button Click
        waBtn.addEventListener('click', () => {
            const message = getSupportMessage();
            if (message) {
                const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
                window.open(url, '_blank');
            }
        });

        // Telegram Button Click
        tgBtn.addEventListener('click', () => {
            const message = getSupportMessage();
            if (message) {
                // Note: Telegram does not support pre-filling text for direct user chats via URL easily.
                // We copy the message to the clipboard and open the chat.
                const plainTextMessage = `Hello SMM-MARIA Support, I need to reset my password.\n\nName: ${nameInput.value.trim()}\nEmail: ${emailInput.value.trim()}\nPhone Used: ${phoneInput.value.trim()}`;
                
                navigator.clipboard.writeText(plainTextMessage).then(() => {
                    alert("Your details have been copied! Please paste them into the Telegram chat.");
                    const url = `https://t.me/${TELEGRAM_USERNAME}`;
                    window.open(url, '_blank');
                }).catch(() => {
                    // Fallback if clipboard API fails
                    const url = `https://t.me/${TELEGRAM_USERNAME}`;
                    window.open(url, '_blank');
                });
            }
        });
    </script>
</body>
</html>
